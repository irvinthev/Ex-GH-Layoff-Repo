name: Placement Tests

on:
  pull_request:
    paths:
      - 'supabase/functions/evaluate-job/**'
      - 'tests/**'
      - 'placement-beta.js'
      - 'placement-beta-display.js'
      - 'placement-utils.js'
      - 'shortlist*.js'
      - 'shortlist*.html'
      - 'shortlist.css'
      - 'script.js'
      - 'index.html'
      - 'shortlists/**'
      - '.github/workflows/placement-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/evaluate-job/**'
      - 'tests/**'
      - 'placement-beta.js'
      - 'placement-beta-display.js'
      - 'placement-utils.js'
      - 'shortlist*.js'
      - 'shortlist*.html'
      - 'shortlist.css'
      - 'script.js'
      - 'index.html'
      - 'shortlists/**'
      - '.github/workflows/placement-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placement-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic placement regression suite
        run: node --experimental-strip-types --test tests/*.test.mjs
