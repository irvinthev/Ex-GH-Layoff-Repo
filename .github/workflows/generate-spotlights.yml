name: Generate Spotlight Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "people-stories.json"
      - "scripts/generate_spotlights.py"
      - ".github/workflows/generate-spotlights.yml"

jobs:
  generate-spotlights:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate Spotlight pages
        run: python3 scripts/generate_spotlights.py

      - name: Commit generated Spotlight pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add spotlight/

          if git diff --cached --quiet; then
            echo "No Spotlight page changes"
          else
            git commit -m "Generate Spotlight pages"
            git push
          fi
