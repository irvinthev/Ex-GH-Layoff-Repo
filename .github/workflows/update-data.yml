name: Update Directory Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # -------------------------
      # PEOPLE
      # -------------------------

      - name: Download people CSV
        run: |
          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --max-time 30 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTneLfd7McnMAUWannvW6a3h-tgjHxzgC7xKFTY3s1SjaRHa2Rw-JFQQYXPcOjBQ0UtACBo1S_mm9E-/pub?gid=0&single=true&output=csv" \
            -o people.csv

          echo "Downloaded $(wc -c < people.csv) bytes"

      - name: Validate people CSV download
        run: |
          echo "File size:"
          wc -c people.csv

          echo "File type:"
          file people.csv

          if [ ! -s people.csv ]; then
            echo "ERROR: people.csv is empty"
            exit 1
          fi

          if grep -qiE '<!DOCTYPE html|<html' people.csv; then
            echo "ERROR: people.csv download returned HTML instead of CSV"
            exit 1
          fi

          python3 - <<'PY'
          import csv
          import sys

          with open("people.csv", newline="", encoding="utf-8-sig") as f:
              reader = csv.reader(f)
              headers = next(reader, [])

          required_headers = {"First Name", "Last Name"}
          missing_headers = required_headers - set(headers)

          if missing_headers:
              print(
                  "ERROR: people.csv is missing expected headers: "
                  + ", ".join(sorted(missing_headers))
              )
              sys.exit(1)

          print("people.csv appears valid")
          PY

      - name: Convert people CSV to people.json
        run: |
          python3 - <<'PY'
          import csv
          import json

          with open("people.csv", newline="", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)

              rows = [
                  row
                  for row in reader
                  if any(str(value or "").strip() for value in row.values())
              ]

          with open("people.json", "w", encoding="utf-8") as output:
              json.dump(rows, output, ensure_ascii=False, indent=2)

          print(f"Converted {len(rows)} people records")
          PY

      # -------------------------
      # PLACED
      # -------------------------

      - name: Download placed CSV
        run: |
          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --max-time 30 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTneLfd7McnMAUWannvW6a3h-tgjHxzgC7xKFTY3s1SjaRHa2Rw-JFQQYXPcOjBQ0UtACBo1S_mm9E-/pub?gid=340284935&single=true&output=csv" \
            -o placed.csv

          echo "Downloaded $(wc -c < placed.csv) bytes"

      - name: Validate placed CSV download
        run: |
          echo "File size:"
          wc -c placed.csv

          echo "File type:"
          file placed.csv

          if [ ! -s placed.csv ]; then
            echo "ERROR: placed.csv is empty"
            exit 1
          fi

          if grep -qiE '<!DOCTYPE html|<html' placed.csv; then
            echo "ERROR: placed.csv download returned HTML instead of CSV"
            exit 1
          fi

          python3 - <<'PY'
          import csv
          import sys

          with open("placed.csv", newline="", encoding="utf-8-sig") as f:
              reader = csv.reader(f)
              headers = next(reader, [])

          required_headers = {
              "First Name",
              "Last Name",
              "Placement Flag",
          }
          missing_headers = required_headers - set(headers)

          if missing_headers:
              print(
                  "ERROR: placed.csv is missing expected headers: "
                  + ", ".join(sorted(missing_headers))
              )
              sys.exit(1)

          print("placed.csv appears valid")
          PY

      - name: Convert placed CSV to placed.json
        run: |
          python3 - <<'PY'
          import csv
          import json

          with open("placed.csv", newline="", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)

              rows = [
                  row
                  for row in reader
                  if any(str(value or "").strip() for value in row.values())
              ]

          with open("placed.json", "w", encoding="utf-8") as output:
              json.dump(rows, output, ensure_ascii=False, indent=2)

          print(f"Converted {len(rows)} placed records")
          PY

      # -------------------------
      # VALIDATE JSON
      # -------------------------

      - name: Install validation dependency
        run: python3 -m pip install --user jsonschema

      - name: Validate JSON data
        run: python3 scripts/validate_data.py

      # -------------------------
      # COMMIT + PUSH
      # -------------------------

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add people.json placed.json

          if git diff --cached --quiet; then
            echo "No directory data changes"
          else
            git commit -m "Update directory data"
            git push
          fi
